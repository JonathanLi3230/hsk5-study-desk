<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>HSK 5 Study Desk</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Sans+SC:wght@400;500&family=Noto+Serif+SC:wght@400;600&display=swap">
<style>/* Layout: study desk — fixed rail of sections on desktop, bottom tabs on phones; one focused column of work. */
:root{
  --bg:#f4f6f4; --surface:#ffffff; --sunk:#eaeeeb; --ink:#16201c; --muted:#5a6762; --line:#d9e0dc;
  --accent:#0d6b55; --accent-ink:#ffffff; --accent-soft:#dff0ea;
  --again:#b3261e; --hard:#a5590a; --good:#0d6b55; --easy:#1f5fa6;
  --grid:#d99a8f; --hl:#fff1c2;
  --f-han:"Noto Serif SC","Songti SC","STSong",serif;
  --f-ui:"IBM Plex Sans","Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --f-sans-han:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1412; --surface:#161d1a; --sunk:#1d2522; --ink:#e7ece9; --muted:#9aa6a1; --line:#2b3531;
  --accent:#4fc3a1; --accent-ink:#06231b; --accent-soft:#173329;
  --again:#f07a6e; --hard:#e7a45c; --good:#4fc3a1; --easy:#7fb2ec; --grid:#7a453d; --hl:#4a3f17; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1412; --surface:#161d1a; --sunk:#1d2522; --ink:#e7ece9; --muted:#9aa6a1; --line:#2b3531;
  --accent:#4fc3a1; --accent-ink:#06231b; --accent-soft:#173329;
  --again:#f07a6e; --hard:#e7a45c; --good:#4fc3a1; --easy:#7fb2ec; --grid:#7a453d; --hl:#4a3f17; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.han{font-family:var(--f-han);font-weight:400}
.zh{font-family:var(--f-sans-han)}
a{color:var(--accent)}
h1,h2,h3{text-wrap:balance;margin:0;line-height:1.25}
h1{font-size:1.55rem;font-weight:600;letter-spacing:-.01em}
h2{font-size:1.15rem;font-weight:600}
h3{font-size:.95rem;font-weight:600}
.label{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.tabnum{font-variant-numeric:tabular-nums}

/* shell */
.shell{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:100%}
.rail{position:sticky;top:env(safe-area-inset-top,0px);height:100vh;padding:20px 12px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:2px;background:var(--surface)}
.brand{display:flex;align-items:baseline;gap:8px;padding:4px 10px 18px}
.brand .han{font-size:1.7rem;font-weight:600;color:var(--accent);white-space:nowrap}
.brand span:last-child{font-weight:600;font-size:.95rem}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;text-decoration:none;color:var(--ink);font-weight:500}
.nav a .k{margin-left:auto;font-size:.7rem;color:var(--muted);font-family:var(--f-ui)}
.nav a .han{width:20px;text-align:center;color:var(--muted);font-size:1.05rem}
.nav a:hover{background:var(--sunk)}
.nav a[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.nav a[aria-current="page"] .han{color:var(--accent)}
.rail .foot{margin-top:auto;padding:10px;font-size:.78rem;color:var(--muted)}
main{min-width:0;padding-block:24px 96px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.col{max-width:780px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.tabs{display:none}
@media (max-width:880px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .rail{display:none}
  main{padding-block:16px 110px}
  .tabs{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
    padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
  .tabs a{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;text-decoration:none;color:var(--muted);font-size:.68rem;padding:4px 0;border-radius:8px}
  .tabs a .han{font-size:1.15rem}
  .tabs a[aria-current="page"]{color:var(--accent)}
  .k,.kbd-hint{display:none!important}
}
.topbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.topbar h1{margin-right:auto}

/* surfaces */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.panel.tight{padding:12px 14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:10px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
hr.sep{border:0;border-top:1px solid var(--line);margin:4px 0}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:500;min-height:38px;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--sunk)}
.btn.sm{padding:4px 10px;min-height:30px;font-size:.85rem}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn .k{font-size:.7rem;opacity:.7;border:1px solid currentColor;border-radius:4px;padding:0 4px;line-height:1.3}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:.75rem;padding:2px 9px;border-radius:999px;background:var(--sunk);color:var(--muted);font-weight:500;white-space:nowrap}
.chip.acc{background:var(--accent-soft);color:var(--accent)}
.chip.warn{background:color-mix(in srgb,var(--hard) 16%,transparent);color:var(--hard)}
.chip.bad{background:color-mix(in srgb,var(--again) 14%,transparent);color:var(--again)}
.chip.blue{background:color-mix(in srgb,var(--easy) 15%,transparent);color:var(--easy)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:6px 12px;cursor:pointer;font-size:.86rem;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.seg button+button{border-left:1px solid var(--line)}
input[type=text],input[type=search],input[type=number],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-height:38px;width:100%}
textarea{min-height:96px;resize:vertical;font-family:var(--f-sans-han);font-size:1.05rem;line-height:1.6}
select{width:auto}
input.zhin{font-family:var(--f-sans-han);font-size:1.1rem}

/* audio */
.aud{display:inline-flex;gap:4px;align-items:center}
.aud button{border:1px solid var(--line);background:var(--surface);border-radius:999px;height:30px;min-width:30px;padding:0 10px;cursor:pointer;display:inline-flex;align-items:center;gap:5px;font-size:.78rem;color:var(--muted)}
.aud button:hover{color:var(--accent);border-color:var(--accent)}
.aud svg{width:14px;height:14px}
.banner{border:1px solid color-mix(in srgb,var(--hard) 40%,var(--line));background:color-mix(in srgb,var(--hard) 9%,var(--surface));border-radius:var(--r);padding:12px 14px;font-size:.88rem}
.note{border-left:3px solid var(--accent);padding:6px 12px;background:var(--accent-soft);border-radius:0 8px 8px 0;font-size:.9rem}
.note.tw{border-left-color:var(--easy);background:color-mix(in srgb,var(--easy) 10%,var(--surface))}

/* pinyin reveal */
.py{font-size:.92rem;color:var(--muted);letter-spacing:.01em}
.py.hid{cursor:pointer;color:transparent;background:repeating-linear-gradient(90deg,var(--sunk) 0 6px,transparent 6px 9px);border-radius:4px;user-select:none;min-width:5ch;display:inline-block}
.py.hid:hover{background:repeating-linear-gradient(90deg,var(--line) 0 6px,transparent 6px 9px)}
.py.hid::after{content:"";}
.showpy .py.hid{color:var(--muted);background:none;cursor:default}

/* today */
.hero{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px;align-items:center}
@media (max-width:560px){.hero{grid-template-columns:1fr}}
.counts{display:flex;gap:22px;flex-wrap:wrap}
.count b{display:block;font-size:2rem;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}
.count span{font-size:.8rem;color:var(--muted)}
.count.due b{color:var(--easy)} .count.new b{color:var(--accent)} .count.wr b{color:var(--hard)}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.stepper button{border:0;background:var(--surface);width:34px;height:34px;cursor:pointer;font-size:1.1rem}
.stepper span{min-width:40px;text-align:center;font-weight:600;font-variant-numeric:tabular-nums}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.tile{display:flex;flex-direction:column;gap:4px;text-align:left;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;color:var(--ink)}
.tile:hover{border-color:var(--accent)}
.tile .han{font-size:1.4rem;color:var(--accent)}
.tile b{font-weight:600}

/* flashcard */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:26px 22px;display:flex;flex-direction:column;gap:16px;min-height:320px}
.card .head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card .head .sp{margin-left:auto}
.bigword{font-family:var(--f-han);font-size:clamp(3rem,11vw,4.6rem);line-height:1.1;text-align:center;letter-spacing:.04em;padding:8px 0}
.mean{font-size:1.15rem;text-align:center}
.cent{text-align:center}
.ex{border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:4px}
.ex .zhl{font-family:var(--f-sans-han);font-size:1.22rem;line-height:1.65}
.ex mark{background:var(--hl);color:inherit;border-radius:3px;padding:0 1px}
.ex .en{color:var(--muted)}
.colls{display:flex;flex-wrap:wrap;gap:8px}
.coll{border:1px solid var(--line);border-radius:8px;padding:5px 10px;display:flex;flex-direction:column;gap:0;background:var(--bg)}
.coll .zh{font-size:1rem}
.coll .py{font-size:.78rem}
.rate{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.rate button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:600}
.rate button small{font-weight:400;font-size:.74rem;color:var(--muted)}
.rate .a{color:var(--again)} .rate .h{color:var(--hard)} .rate .g{color:var(--good)} .rate .e{color:var(--easy)}
.rate button:hover{background:var(--sunk)}
.progressline{height:4px;background:var(--sunk);border-radius:4px;overflow:hidden}
.progressline i{display:block;height:100%;background:var(--accent);transition:width .25s}
.kbd-hint{font-size:.75rem;color:var(--muted);text-align:center}
kbd{font-family:var(--f-ui);font-size:.72rem;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;background:var(--surface)}

/* list */
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.li{display:grid;grid-template-columns:110px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer;text-align:left;background:none;border-left:0;border-right:0;border-top:0;width:100%}
.li:last-child{border-bottom:0}
.li:hover{background:var(--sunk)}
.li .han{font-size:1.35rem}
.li .m{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;background:var(--line)}
.dot.learning{background:var(--hard)} .dot.review{background:var(--easy)} .dot.mastered{background:var(--good)} .dot.due{background:var(--again)}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.filters select{width:100%}

/* sheet */
.overlay{position:fixed;inset:0;background:rgba(10,15,13,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px))}
@media (min-width:700px){.overlay{align-items:center;padding-bottom:16px}}
.sheet{background:var(--bg);width:100%;max-width:720px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
@media (min-width:700px){.sheet{border-radius:16px}}

/* quiz */
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:560px){.opts{grid-template-columns:1fr}}
.opt{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:12px 14px;cursor:pointer;text-align:left;display:flex;gap:10px;align-items:baseline}
.opt .n{font-size:.72rem;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 5px}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 10%,var(--surface))}
.opt.wrong{border-color:var(--again);background:color-mix(in srgb,var(--again) 9%,var(--surface))}
.opt[disabled]{cursor:default}
.opt .han{font-size:1.3rem}
.q-zh{font-family:var(--f-sans-han);font-size:1.35rem;line-height:1.7}
.blank{display:inline-block;min-width:3.2em;border-bottom:2px solid var(--accent);text-align:center;color:var(--accent)}
.expl{display:flex;flex-direction:column;gap:8px;font-size:.92rem}
.expl .why{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px}
.verdict{font-weight:600}
.verdict.ok{color:var(--good)} .verdict.no{color:var(--again)} .verdict.mid{color:var(--hard)}

/* writing */
.tokens{display:flex;flex-wrap:wrap;gap:8px}
.tok{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px;cursor:pointer;font-family:var(--f-sans-han);font-size:1.1rem}
.tok.used{opacity:.3;pointer-events:none}
.build{min-height:52px;border:1px dashed var(--line);border-radius:10px;padding:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.build .tok{background:var(--accent-soft);border-color:transparent}
.fb{display:grid;grid-template-columns:120px minmax(0,1fr);gap:8px 14px;font-size:.92rem}
@media (max-width:560px){.fb{grid-template-columns:1fr}}
.fb dt{color:var(--muted);font-weight:600;font-size:.8rem;padding-top:2px}
.fb dd{margin:0}
.levels{display:flex;gap:6px;align-items:center}
.lvl{width:26px;height:6px;border-radius:3px;background:var(--line)}
.lvl.on{background:var(--accent)}
.zhbig{font-family:var(--f-sans-han);font-size:1.15rem;line-height:1.7}

/* handwriting */
.hw-chars{display:flex;gap:14px;flex-wrap:wrap}
.tzg{position:relative;width:130px;height:130px;border:1.5px solid var(--grid);background:var(--surface);border-radius:2px}
.tzg::before,.tzg::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(var(--grid),var(--grid)) center/100% 1px no-repeat,linear-gradient(var(--grid),var(--grid)) center/1px 100% no-repeat;opacity:.55}
.tzg::after{background:linear-gradient(45deg,transparent calc(50% - .5px),var(--grid) 50%,transparent calc(50% + .5px)),linear-gradient(-45deg,transparent calc(50% - .5px),var(--grid) 50%,transparent calc(50% + .5px));opacity:.3}
.tzg .w{position:absolute;inset:0}
.tzg canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;z-index:2}
.tzg.sm{width:96px;height:96px}
.practice{display:flex;flex-wrap:wrap;gap:8px}
.cellwrap{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.7rem;color:var(--muted)}

/* charts */
.bars{display:flex;align-items:flex-end;gap:4px;height:110px}
.bars div{flex:1;background:var(--accent);border-radius:3px 3px 0 0;min-height:1px;position:relative}
.bars div.zero{background:var(--line)}
.barlabels{display:flex;gap:4px;font-size:.68rem;color:var(--muted)}
.barlabels span{flex:1;text-align:center}
.meter{height:8px;border-radius:4px;background:var(--sunk);overflow:hidden;display:flex}
.meter i{display:block;height:100%}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.8rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
table.t{width:100%;border-collapse:collapse;font-size:.88rem}
table.t td,table.t th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left}
table.t th{font-weight:600;color:var(--muted);font-size:.75rem;text-transform:uppercase;letter-spacing:.06em}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:999px;font-size:.88rem;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
.help td:first-child{white-space:nowrap}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<script src="data.js"></script>
<script>/* ===== HSK 5 Study Desk — core: data, storage, SRS, audio, helpers ===== */
const D = window.HSK || { words: [], earlier: [], prag: [], combine: [], prompts: [], TOPICS: {}, REG: {} };
const W = D.words;
const byWord = {}; W.forEach(w => byWord[w.w] = w);
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const shuffle = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0;[a[i], a[j]] = [a[j], a[i]]; } return a; };
const pick = a => a[Math.random() * a.length | 0];
const MIN = 60e3, DAY = 864e5;
const todayKey = (t = Date.now()) => { const d = new Date(t); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
const endOfDay = () => { const d = new Date(); d.setHours(23, 59, 59, 999); return +d; };
const TIER = { 1: 'Core', 2: 'Common', 3: 'Less common' };
const REGLONG = { N: 'Neutral — fine in speech and writing', F: 'Formal — notices, work, news', W: 'Mainly written — essays, news, exams', I: 'Informal — casual speech, chat' };
const TONEMAP = { 'ā': 'a', 'á': 'a', 'ǎ': 'a', 'à': 'a', 'ē': 'e', 'é': 'e', 'ě': 'e', 'è': 'e', 'ī': 'i', 'í': 'i', 'ǐ': 'i', 'ì': 'i', 'ō': 'o', 'ó': 'o', 'ǒ': 'o', 'ò': 'o', 'ū': 'u', 'ú': 'u', 'ǔ': 'u', 'ù': 'u', 'ǖ': 'v', 'ǘ': 'v', 'ǚ': 'v', 'ǜ': 'v', 'ü': 'v' };
const plainPy = s => [...String(s).toLowerCase()].map(c => TONEMAP[c] || c).join('').replace(/[^a-z]/g, '');
function numToMarks(s) { // "an1wei4" -> "ānwèi" for tone-sensitive compare
  const marks = { a: 'āáǎà', e: 'ēéěè', i: 'īíǐì', o: 'ōóǒò', u: 'ūúǔù', v: 'ǖǘǚǜ' };
  return String(s).toLowerCase().replace(/u:/g, 'v').replace(/([a-zv]+)([1-5])/g, (m, syl, t) => {
    if (t === '5') return syl.replace(/v/g, 'ü');
    let i = syl.search(/[ae]/); if (i < 0) i = syl.indexOf('ou'); if (i < 0) { const v = [...syl].map((c, k) => /[aeiouv]/.test(c) ? k : -1).filter(k => k >= 0); i = v[v.length - 1]; }
    if (i == null || i < 0) return syl;
    return (syl.slice(0, i) + marks[syl[i]][+t - 1] + syl.slice(i + 1)).replace(/v/g, 'ü');
  });
}

/* ---------- spaced repetition ---------- */
const STEPS = [1 * MIN, 10 * MIN];
function cardStatus(c, now = Date.now()) {
  if (!c) return 'new';
  if (c.st === 'l') return c.due <= now ? 'due' : 'learning';
  if (c.due <= endOfDay()) return 'due';
  return c.ivl >= 21 ? 'mastered' : 'review';
}
function statusOf(id) { return cardStatus(S.srs[id]); }
function schedule(c, r, now = Date.now()) {
  // r: 1 again, 2 hard, 3 good, 4 easy. Returns a new card object.
  c = c ? { ...c } : { st: 'n', step: 0, ivl: 0, ease: 2.5, reps: 0, lapses: 0, first: now };
  const fuzz = d => d < 3 ? d : Math.round(d * (0.95 + Math.random() * 0.1));
  c.reps++; c.last = now;
  if (c.st === 'n' || c.st === 'l') {
    const relearn = c.st === 'l' && c.ivl > 0;
    if (r === 1) { c.st = 'l'; c.step = 0; c.due = now + STEPS[0]; }
    else if (r === 2) { c.st = 'l'; c.due = now + (c.step === 0 ? 6 * MIN : STEPS[1]); }
    else if (r === 3) {
      if (c.st === 'n' || c.step === 0) { c.st = 'l'; c.step = 1; c.due = now + STEPS[1]; }
      else { c.st = 'r'; c.ivl = relearn ? Math.max(1, c.ivl) : 1; c.due = now + c.ivl * DAY; }
    } else { c.st = 'r'; c.ivl = relearn ? Math.max(2, Math.round(c.ivl * 1.5)) : 4; c.due = now + c.ivl * DAY; }
  } else {
    if (r === 1) { c.lapses++; c.ease = Math.max(1.3, c.ease - 0.2); c.ivl = Math.max(1, Math.round(c.ivl * 0.3)); c.st = 'l'; c.step = 0; c.due = now + STEPS[1]; }
    else if (r === 2) { c.ease = Math.max(1.3, c.ease - 0.15); c.ivl = Math.max(c.ivl + 1, fuzz(Math.round(c.ivl * 1.2))); c.due = now + c.ivl * DAY; }
    else if (r === 3) { c.ivl = Math.max(c.ivl + 1, fuzz(Math.round(c.ivl * c.ease))); c.due = now + c.ivl * DAY; }
    else { c.ease = Math.min(3.2, c.ease + 0.15); c.ivl = Math.max(c.ivl + 2, fuzz(Math.round(c.ivl * c.ease * 1.3))); c.due = now + c.ivl * DAY; }
  }
  return c;
}
function fmtIvl(ms) {
  if (ms < 60 * MIN) return Math.max(1, Math.round(ms / MIN)) + 'm';
  if (ms < DAY) return Math.round(ms / (60 * MIN)) + 'h';
  const d = Math.round(ms / DAY); if (d < 30) return d + 'd'; if (d < 365) return (d / 30).toFixed(d < 60 ? 1 : 0) + 'mo'; return (d / 365).toFixed(1) + 'y';
}
function preview(c) { const now = Date.now(); return [1, 2, 3, 4].map(r => fmtIvl(schedule(c, r, now).due - now)); }
function counts() {
  const now = Date.now(), eod = endOfDay(); let nw = 0, learning = 0, due = 0, mastered = 0, review = 0;
  for (const w of W) {
    const c = S.srs[w.id];
    if (!c) { nw++; continue; }
    if (c.st === 'l') { learning++; if (c.due <= now) due++; }
    else { if (c.due <= eod) due++; if (c.ivl >= 21) mastered++; else review++; }
  }
  return { nw, learning, due, mastered, review, seen: W.length - nw };
}
function newOrder() {
  let pool = W.filter(w => !S.srs[w.id]);
  if (S.set.topic) { const t = pool.filter(w => w.t === S.set.topic); if (t.length) pool = t; }
  if (S.set.order === 'core') pool.sort((a, b) => (a.d - b.d) || ((a.f || 1e9) - (b.f || 1e9)));
  else if (S.set.order === 'random') pool = shuffle(pool);
  return pool;
}
function newLeft() { return Math.max(0, S.set.newPerDay - S.day.new); }
function todayQueue() {
  const now = Date.now(), eod = endOfDay();
  const learning = [], reviews = [];
  for (const w of W) { const c = S.srs[w.id]; if (!c) continue; if (c.st === 'l' && c.due <= now) learning.push(w.id); else if (c.st === 'r' && c.due <= eod) reviews.push(w.id); }
  reviews.sort((a, b) => S.srs[a].due - S.srs[b].due);
  const news = newOrder().slice(0, newLeft()).map(w => w.id);
  // interleave new cards among reviews so sessions don't end on a wall of new words
  const out = [...learning]; const rv = shuffle(reviews); let ni = 0;
  rv.forEach((id, i) => { out.push(id); if (ni < news.length && i % 3 === 2) out.push(news[ni++]); });
  while (ni < news.length) out.push(news[ni++]);

}
function logHist(kind) { const k = todayKey(); const h = S.hist[k] || (S.hist[k] = { rev: 0, new: 0, again: 0, w: 0, q: 0, l: 0, hw: 0 }); h[kind] = (h[kind] || 0) + 1; }

/* writing schedule (separate from flashcards) */
function wsDue() { const eod = endOfDay(); return Object.keys(S.ws).filter(id => S.ws[id].due <= eod).map(Number); }
function writingPool() {

  session = { ids: [...ids], title, i: 0, done: 0, total: ids.length, shown: false, opts, again: 0, started: Date.now() };
  if (location.hash === '#study') renderStudy(); else location.hash = 'study';
}
VIEWS.study = col => { if (!session) { go('today'); return; } renderStudy(); };
function affectsSchedule(id) { const c = S.srs[id]; const st = cardStatus(c); return !c || st === 'due' || session.opts.extraNew; }
function renderStudy() {
  const col = $('#col'); if (!col) return;
  if (!session.ids.length) {
    const c = counts();
    col.innerHTML = `<div class="topbar"><h1>${esc(session.title)} · done</h1></div>
      <section class="panel stack"><p>You went through <b>${session.done}</b> cards${session.again ? `, and pressed Again on ${session.again}` : ''}. Learning cards come back after their short delay; reviews are scheduled for later days.</p>
      <div class="row"><span class="chip">${c.due} still due today</span><span class="chip">${Math.min(newLeft(), c.nw)} new left</span></div>
      <div class="row"><button class="btn primary" id="tw">Practise writing with today’s words</button><a class="btn" href="#hand">Handwriting</a><a class="btn" href="#today">Back to today</a></div></section>`;
    $('#tw').onclick = () => { writeCtx = { fromSession: true }; go('write'); };
    return;
  }
  const id = session.ids[0]; const w = W[id]; const c = S.srs[id]; const sched = affectsSchedule(id); const pv = preview(c);
  const pct = session.done / (session.done + session.ids.length) * 100;
  col.innerHTML = `
  <div class="topbar"><h1>${esc(session.title)}</h1><span class="chip tabnum">${session.ids.length} left</span><button class="btn ghost sm" id="endsess">End session</button></div>
  <div class="progressline"><i style="width:${pct}%"></i></div>
  <article class="card" id="card">
    <div class="head"><span class="chip ${c ? '' : 'acc'}">${c ? statusLabel(cardStatus(c)) : 'New word'}</span>${sched ? '' : '<span class="chip warn" title="This card isn’t due, so your rating won’t change its schedule">Practice only</span>'}
      <span class="sp"></span><button class="btn ghost sm" id="bm" aria-pressed="${!!S.bm[id]}">${S.bm[id] ? '★ Bookmarked' : '☆ Bookmark'} <span class="k kbd-hint">B</span></button></div>
    ${session.shown ? wordDetail(w) : `<div class="bigword" style="padding:30px 0 10px">${esc(w.w)}</div><div class="row" style="justify-content:center">${audioBtns(w.w, 'Word')}</div><div class="cent muted small">Recall the meaning and pronunciation, then check.</div>`}
  </article>
  ${session.shown ? `<div class="rate" role="group" aria-label="How well did you know it?">
      <button class="a" data-r="1">Again<small>${pv[0]} · 1</small></button><button class="h" data-r="2">Difficult<small>${pv[1]} · 2</small></button>
      <button class="g" data-r="3">Good<small>${pv[2]} · 3</small></button><button class="e" data-r="4">Easy<small>${pv[3]} · 4</small></button></div>
      <div class="kbd-hint"><kbd>P</kbd> pinyin · <kbd>A</kbd> word audio · <kbd>S</kbd> sentence · <kbd>Shift</kbd>+<kbd>S</kbd> slow</div>`
      : `<button class="btn primary" id="show" style="min-height:50px">Show answer <span class="k kbd-hint">Space</span></button>`}`;
  $('#endsess').onclick = () => { session = null; go('today'); };
  $('#bm').onclick = () => { bmToggle(id); renderStudy(); };
  const sh = $('#show'); if (sh) sh.onclick = () => { session.shown = true; renderStudy(); };
  $$('[data-r]').forEach(b => b.onclick = () => rate(+b.dataset.r));
}
function rate(r) {
  if (!session || !session.shown) return;
  const id = session.ids.shift(); const old = S.srs[id];
  if (affectsSchedule(id)) {
    const isNew = !old; const c = schedule(old, r); S.srs[id] = c;
    if (isNew) { S.day.new++; logHist('new'); } else { S.day.rev++; logHist('rev'); }
    if (r === 1) { logHist('again'); S.weak[id] = (S.weak[id] || 0) + 1; session.again++; }
    if (c.st === 'l' && c.due - Date.now() <= 20 * MIN) session.ids.splice(Math.min(session.ids.length, r === 1 ? 3 : 6), 0, id);
  } else if (r === 1) { session.ids.splice(Math.min(session.ids.length, 4), 0, id); session.again++; }
  session.done++; session.shown = false; save(); renderStudy();
}

function matchQ(q, w, py, m) {
  if (!q) return true; const ql = q.toLowerCase().trim();
  if (/[一-鿿]/.test(ql)) return w.includes(ql);
  const qp = plainPy(ql);
  if (qp && plainPy(py).startsWith(qp)) return true;
  if (/[1-5āáǎàēéěèīíǐìōóǒòūúǔù]/.test(ql) && tonedPy(py).startsWith(tonedPy(ql))) return true;
  return m.toLowerCase().includes(ql);
}
function filtered() {
  return W.filter(w => {
    if (browse.topic && w.t !== browse.topic) return false;
    if (browse.diff && w.d != browse.diff) return false;
    if (browse.reg && w.reg !== browse.reg) return false;
    if (browse.st) { if (browse.st === 'bookmarked') { if (!S.bm[w.id]) return false; } else if (browse.st === 'weak') { if (!S.weak[w.id]) return false; } else if (statusOf(w.id) !== browse.st) return false; }
    return matchQ(browse.q, w.w, w.py, w.m);
  });
}

/* ===== Listening and quizzes ===== */
function studiedPool(min = 40) {
  const seen = W.filter(w => S.srs[w.id]).sort((a, b) => (S.srs[b.id].last || 0) - (S.srs[a.id].last || 0));
  if (seen.length >= min) return seen;
  return [...seen, ...W.filter(w => !S.srs[w.id] && w.d === 1).slice(0, min - seen.length + 40)];
}
function poolNote() { const n = W.filter(w => S.srs[w.id]).length; return n >= 40 ? `Drawn from the ${n} words you’ve studied, most recent first.` : `You’ve studied ${n} words so far, so this also includes core (high-frequency) words you haven’t met yet.`; }

let LQ = null; let listenMode = 'word';
VIEWS.listen = col => {
  col.innerHTML = `${voiceBanner()}

function newListen() {
  const pool = shuffle(studiedPool().slice(0, 120)).slice(0, 10);
  LQ = { mode: listenMode, i: 0, score: 0, items: pool.map(w => {
    if (listenMode === 'word') { const ds = distractors(w, 3, { field: 'm' }); return { w, kind: 'word', opts: shuffle([w, ...ds]), ans: null }; }
    if (listenMode === 'sent') {
      const ask = w.ex.length > 1 || Math.random() < 0.5 ? 'trans' : 'which';
      if (ask === 'which') { const ds = distractors(w, 3, { sameChar: true }); return { w, kind: 'which', opts: shuffle([w, ...ds]), ans: null }; }
      const ds = distractors(w, 3).filter(x => x.exE.join(' ') !== w.exE.join(' ')); return { w, kind: 'trans', opts: shuffle([w, ...ds]), ans: null };
    }
    const sentence = Math.random() < 0.5; return { w, kind: 'dict', target: sentence ? lastLine(w) : w.w, sentence, typeBy: 'han', ans: null };
  }) };
}
function renderListen() {
  const box = $('#lq'); if (!box) return;

    box.innerHTML = `<section class="panel stack"><h2>Round complete · ${LQ.score}/${LQ.items.length}</h2><p class="muted small">Words you missed are added to your “struggled with” list and come up more in writing practice.</p><div class="row"><button class="btn primary" id="again">New round</button></div></section>`;

    if (it.kind === 'word' && !ok) { const o = W[it.ans]; extra = `<div class="small">“${esc(o.m)}” is <span class="han">${esc(o.w)}</span> (${esc(o.py)}).</div>`; }

  const gu = $('#giveup'); if (gu) gu.onclick = () => { it.ans = { ok: false, text: '' }; S.weak[w.id] = (S.weak[w.id] || 0) + 1; save(); renderListen(); };
  const ln = $('#lnext'); if (ln) ln.onclick = () => { LQ.i++; renderListen(); };

function answerListen(oid) {
  const it = LQ.items[LQ.i]; if (it.ans !== null) return;
  it.ans = oid; it.ok = oid === it.w.id;
  if (it.ok) LQ.score++; else S.weak[it.w.id] = (S.weak[it.w.id] || 0) + 1;
  logHist('l'); save(); renderListen();
}
function checkDict() {
  const it = LQ.items[LQ.i]; const v = $('#dictin').value.trim(); if (!v) return;
  let ok = false, near = false;
  if (it.typeBy === 'han') ok = zhOnly(v) === zhOnly(it.target);
  else {
    const tgt = it.sentence ? it.w.exP[it.w.exP.length - 1] : it.w.py;
    const hasTones = /[1-5āáǎàēéěèīíǐìōóǒòūúǔùǖǘǚǜ]/.test(v);
    const plainOk = plainPy(numToMarks(v)) === plainPy(tgt);
    ok = hasTones ? tonedPy(v) === tonedPy(tgt) : plainOk; near = hasTones && !ok && plainOk;
  }
  it.ans = { ok, text: v, near }; if (ok) LQ.score++; else S.weak[it.w.id] = (S.weak[it.w.id] || 0) + 1;
  logHist('l'); save(); renderListen();
}

/* ---------- Quizzes ---------- */
let QZ = null; let quizType = 'mixed'; let quizTyping = false;
const QTYPES = { mixed: 'Mixed', meaning: 'Meaning', reverse: 'English → Chinese', cloze: 'Sentence completion', context: 'Right word in context' };
VIEWS.quiz = col => {
  col.innerHTML = `<div class="topbar"><h1>Quizzes</h1></div>
  <div class="row"><div class="seg" role="group" aria-label="Quiz type" style="flex-wrap:wrap">${Object.entries(QTYPES).map(([k, l]) => `<button type="button" data-qt="${k}" aria-pressed="${quizType === k}">${l}</button>`).join('')}</div>
  <label class="row small"><input type="checkbox" id="qtyping" ${quizTyping ? 'checked' : ''}> Type answers for completion questions</label></div>
  <div class="small muted">${poolNote()}</div><div id="qz"></div>`;
  $$('[data-qt]').forEach(b => b.onclick = () => { quizType = b.dataset.qt; QZ = null; route(); });
  $('#qtyping').onchange = e => { quizTyping = e.target.checked; QZ = null; route(); };
  if (!QZ || QZ.done) newQuiz();
  renderQuiz();
};
function newQuiz() {
  const pool = shuffle(studiedPool().slice(0, 150)).slice(0, 10);
  QZ = { i: 0, score: 0, done: false, items: pool.map((w, k) => {
    const t = quizType === 'mixed' ? ['meaning', 'reverse', 'cloze', 'context'][k % 4] : quizType;
    const typed = quizTyping && (t === 'cloze' || t === 'context');
    const opts = t === 'meaning' ? shuffle([w, ...distractors(w, 3, { field: 'm' })]) : shuffle([w, ...distractors(w, 3, { sameChar: t === 'context' })]);
    return { w, t, typed, opts, ans: null };
  }) };
}
function clozeText(w) { const s = lastLine(w); return s.includes(w.w) ? esc(s).split(esc(w.w)).join('<span class="blank">？</span>') : esc(s) + ' <span class="blank">？</span>'; }
function renderQuiz() {
  const box = $('#qz'); if (!box) return;

    <div class="row">${Object.keys(S.bm).map(Number).map(i => `<button class="chip" data-w="${i}" style="cursor:pointer"><span class="han">${esc(W[i].w)}</span></button>`).join('') || '<span class="small muted">Press B on any card to bookmark it.</span>'}</div></section>
  <section class="panel stack"><h2>Backup</h2>
    <div class="small muted">Your progress is saved automatically. You can also copy a backup to move it somewhere else.</div>
    <div class="row"><button class="btn sm" id="bcopy">Copy backup</button><button class="btn sm" id="bimp">Restore from backup…</button><button class="btn sm ghost" id="breset">Reset all progress…</button></div><div id="bbox"></div></section>`;
  $$('[data-w]', col).forEach(b => b.onclick = () => openWord(+b.dataset.w));
  $('#bcopy').onclick = async () => { const t = JSON.stringify(S); try { await navigator.clipboard.writeText(t); toast('Backup copied'); } catch (e) { $('#bbox').innerHTML = `<textarea readonly id="bt">${esc(t)}</textarea>`; $('#bt').select(); toast('Select and copy the text'); } };
  $('#bimp').onclick = () => { $('#bbox').innerHTML = `<textarea id="bt" placeholder="Paste a backup here"></textarea><div class="row"><button class="btn sm primary" id="bdo">Restore</button></div>`; $('#bdo').onclick = () => { try { const s = JSON.parse($('#bt').value); if (s.v !== 1 || !s.srs) throw 0; S = Object.assign(fresh(), s, { set: Object.assign(fresh().set, s.set) }); save(); toast('Progress restored'); route(); } catch (e) { toast('That doesn’t look like a backup from this app'); } }; };
  $('#breset').onclick = () => { $('#bbox').innerHTML = `<div class="banner">This deletes all reviews, writing answers and bookmarks. <button class="btn sm" id="bconf">Yes, reset everything</button></div>`; $('#bconf').onclick = () => { const set = S.set; S = fresh(); S.set = set; save(); toast('Progress reset'); route(); }; };
};

/* ===== Settings & sources ===== */
VIEWS.settings = col => {
  const vs = TTS.zh;
  col.innerHTML = `<div class="topbar"><h1>Settings &amp; sources</h1></div>
  <section class="panel stack"><h2>Study</h2>
    <label class="row"><span style="min-width:170px">New words per day</span><input type="number" id="snew" min="0" max="100" value="${S.set.newPerDay}" style="width:100px"></label>
    <label class="row"><span style="min-width:170px">Order of new words</span><select id="sord"><option value="core" ${S.set.order === 'core' ? 'selected' : ''}>Most frequent first (recommended)</option><option value="list" ${S.set.order === 'list' ? 'selected' : ''}>Syllabus (alphabetical) order</option><option value="random" ${S.set.order === 'random' ? 'selected' : ''}>Random</option></select></label>
    <label class="row"><span style="min-width:170px">Focus new words on</span><select id="stop"><option value="">All topics</option>${Object.entries(D.TOPICS).map(([k, v]) => `<option value="${k}" ${S.set.topic === k ? 'selected' : ''}>${esc(v)}</option>`).join('')}</select></label>
    <label class="row"><span style="min-width:170px">Pinyin</span><select id="spy"><option value="hidden" ${S.set.pinyin === 'hidden' ? 'selected' : ''}>Hidden until tapped (or press P)</option><option value="shown" ${S.set.pinyin === 'shown' ? 'selected' : ''}>Always visible</option></select></label>
    <label class="row"><input type="checkbox" id="sai" ${S.set.ai ? 'checked' : ''}> Use AI feedback for open-ended writing</label></section>
  <section class="panel stack"><h2>Audio</h2>
    <div class="small muted">Pronunciation uses your browser’s text-to-speech with a Mandarin (zh-CN) voice, so quality depends on your device. Sentence pinyin is generated automatically and may occasionally misread a multi-reading character. Word pinyin follows the dictionary.</div>
    ${vs.length ? `<label class="row"><span style="min-width:170px">Voice</span><select id="svoice">${vs.map(v => `<option value="${esc(v.voiceURI)}" ${chosenVoice() === v ? 'selected' : ''}>${esc(v.name)} (${esc(v.lang)})</option>`).join('')}</select><button class="btn sm" data-say="我们周末去看展览吧。">Test</button></label>` : voiceBanner()}
    <label class="row"><span style="min-width:170px">Normal speed</span><input type="range" id="srn" min="0.6" max="1.2" step="0.05" value="${S.set.rateN}" style="width:180px"><span class="tabnum small">${S.set.rateN}×</span></label>
    <label class="row"><span style="min-width:170px">Slow speed</span><input type="range" id="srs" min="0.3" max="0.8" step="0.05" value="${S.set.rateS}" style="width:180px"><span class="tabnum small">${S.set.rateS}×</span></label></section>
  <section class="panel stack small"><h2>About the vocabulary</h2>
    <p><b>Syllabus.</b> HSK 3.0, using the exam syllabus that CTI/CLEC released in November 2025. The first official HSK 3.0 exams (Levels 1–6) are scheduled for 13 December 2026. This app covers all <b>${W.length}</b> words that are new at Level 5. The cumulative total for Levels 1–5 is about 3,500. Levels 1–4 (${D.earlier.length} words) appear in the Word list as a reference that isn’t scheduled for review.</p>
    <p><b>Source.</b> The word list and part-of-speech data come from the open <a href="https://github.com/drkameleon/complete-hsk-vocabulary" target="_blank" rel="noopener">complete-hsk-vocabulary</a> dataset (its “newest” HSK 3.0 lists, which follow the 2025 syllabus). Its definitions come from CC-CEDICT. The English meanings, example sentences and dialogues, register labels, topics, combinations, usage notes and Taiwan notes in this app were written for it. Learning difficulty comes from the dataset’s word-frequency ranking (Core = most frequent third).</p>
    <p><b>Beyond the list.</b> The Conversation section, its idioms and set phrases, and the combine-sentence and short-writing exercises are additions to the list and are labelled as such. Example sentences sometimes use words from other levels so they read naturally.</p>
    <p><b>Stroke order</b> comes from <a href="https://github.com/chanind/hanzi-writer-data" target="_blank" rel="noopener">hanzi-writer-data</a> (Arphic Public License, based on Make Me a Hanzi). The animations use Hanzi Writer.</p>
    <p><b>AI feedback.</b> Writing feedback and deeper quiz explanations come from Claude, through this page’s built-in access when you open it in Claude. You don’t need an API key. The first time, Claude asks for permission. Without it, open-ended answers use self-check against a suggested answer, and exact-match checks are labelled as exact-match.</p></section>
  <section class="panel small"><h2 style="margin-bottom:8px">Keyboard shortcuts</h2>${helpTable()}</section>`;
  const bind = (id, fn) => { const el = $('#' + id); if (el) el.onchange = e => { fn(e.target); save(); route(); }; };
  bind('snew', t => S.set.newPerDay = Math.max(0, Math.min(100, +t.value || 0)));
  bind('sord', t => S.set.order = t.value); bind('stop', t => S.set.topic = t.value); bind('spy', t => S.set.pinyin = t.value);
  bind('sai', t => S.set.ai = t.checked); bind('svoice', t => S.set.voice = t.value);
  bind('srn', t => S.set.rateN = +t.value); bind('srs', t => S.set.rateS = +t.value);
};
function helpTable() {
  return `<table class="t help"><tbody>
  <tr><td><kbd>g</kbd> then <kbd>t</kbd> <kbd>c</kbd> <kbd>l</kbd> <kbd>q</kbd> <kbd>w</kbd> <kbd>h</kbd> <kbd>e</kbd> <kbd>p</kbd> <kbd>s</kbd></td><td>Go to Today, Word list, Listening, Quizzes, Writing, Handwriting, Conversation, Progress, Settings</td></tr>
  <tr><td><kbd>Enter</kbd></td><td>Start review on Today · next question</td></tr>
  <tr><td><kbd>Space</kbd></td><td>Show answer on a flashcard</td></tr>
  <tr><td><kbd>1</kbd>–<kbd>4</kbd></td><td>Again / Difficult / Good / Easy · choose a quiz option</td></tr>
  <tr><td><kbd>P</kbd></td><td>Show pinyin on the current screen</td></tr>
  <tr><td><kbd>A</kbd> · <kbd>S</kbd> · <kbd>Shift</kbd>+<kbd>S</kbd></td><td>Play word · play sentence · play sentence slowly</td></tr>
  <tr><td><kbd>R</kbd> · <kbd>Shift</kbd>+<kbd>R</kbd></td><td>Replay listening audio · slowly</td></tr>
  <tr><td><kbd>B</kbd></td><td>Bookmark the current card</td></tr>
  <tr><td><kbd>Ctrl</kbd>+<kbd>Enter</kbd></td><td>Submit a writing answer</td></tr>
  <tr><td><kbd>Esc</kbd></td><td>Close a word card</td></tr></tbody></table>`;
}

/* ===== global events ===== */
document.addEventListener('click', e => {
  const say = e.target.closest('[data-say]'); if (say) { speak(say.dataset.say, !!say.dataset.slow); return; }
  const py = e.target.closest('.py.hid'); if (py) { py.classList.remove('hid'); return; }
  const wbtn = e.target.closest('.li[data-w]'); if (wbtn) { openWord(+wbtn.dataset.w); return; }
});
document.addEventListener('keydown', e => {
  if (e.target.matches('.py.hid') && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); e.target.classList.remove('hid'); }
});
let gPending = 0;
document.addEventListener('keydown', e => {
  const typing = e.target.matches('input,textarea,select') || e.target.isContentEditable;
  if (e.key === 'Escape') { if ($('#ov')) { closeSheet(); e.preventDefault(); } return; }
  if (typing || e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key;
  if (gPending && Date.now() - gPending < 1200) { gPending = 0; const n = NAV.find(x => x[3] === k.toLowerCase()); if (n) { e.preventDefault(); go(n[0]); } return; }
  if (k === 'g') { gPending = Date.now(); return; }
  if (k === '?') { $('#layer').innerHTML = `<div class="overlay" id="ov"><div class="sheet"><div class="row" style="justify-content:space-between"><h2>Keyboard shortcuts</h2><button class="btn ghost sm" id="closeov">Close</button></div>${helpTable()}</div></div>`; $('#closeov').onclick = closeSheet; $('#ov').onclick = ev => { if (ev.target.id === 'ov') closeSheet(); }; return; }
  if (k === 'p' || k === 'P') { const scope = $('#ov') || $('#main'); $$('.py.hid', scope).forEach(p => p.classList.remove('hid')); return; }
  if ($('#ov')) { const w = $('#ov .bigword'); if (k === 'a' && w) speak(w.textContent); return; }
  if (view === 'today' && k === 'Enter') { const s = $('#start'); if (s && !s.disabled) { e.preventDefault(); s.click(); } return; }
  if (view === 'study' && session && session.ids.length) {
    const w = W[session.ids[0]];
    if (k === ' ' || k === 'Enter') { e.preventDefault(); if (!session.shown) { session.shown = true; renderStudy(); } return; }
    if (/^[1-4]$/.test(k) && session.shown) { e.preventDefault(); rate(+k); return; }
    if (k === 'a') { speak(w.w); return; }
    if (k === 's') { speak(w.ex.join('//')); return; }
    if (k === 'S') { speak(w.ex.join('//'), true); return; }
    if (k === 'b' || k === 'B') { bmToggle(w.id); renderStudy(); return; }
  }
  if (view === 'listen' && LQ) {
    if (k === 'r') { speak(LQ.audio); return; } if (k === 'R') { speak(LQ.audio, true); return; }
    if (/^[1-4]$/.test(k)) { const b = $$('[data-o]')[+k - 1]; if (b && !b.disabled) b.click(); return; }
    if (k === 'Enter') { const n = $('#lnext'); if (n) { e.preventDefault(); n.click(); } return; }
  }
  if (view === 'quiz' && QZ) {
    if (/^[1-4]$/.test(k)) { const b = $$('[data-q]')[+k - 1]; if (b && !b.disabled) b.click(); return; }
    if (k === 'Enter') { const n = $('#qnext'); if (n) { e.preventDefault(); n.click(); } return; }
  }
});
window.addEventListener('hashchange', route);
(function boot() {
  shell();
  if (!W.length) { $('#main').innerHTML = '<div class="col"><div class="banner">The vocabulary file didn’t load. Reload the page to try again.</div></div>'; return; }
  route();
})();
</script>
</body></html>
